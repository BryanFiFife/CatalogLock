name: CatalogLock
description: Security-gate ARD catalogs and live MCP tool surfaces; emit a deterministic lockfile, SARIF and HTML report.
author: BryanFiFife
branding:
  icon: lock
  color: purple
inputs:
  target:
    description: Domain or ARD ai-catalog URL to scan
    required: true
  policy:
    description: Optional CatalogLock policy JSON path
    required: false
  fail-on:
    description: info, warning, error or critical
    required: false
    default: error
  inspect-mcp-tools:
    description: Inspect public MCP Server Cards and lock live tools/list surfaces
    required: false
    default: "true"
  lockfile:
    description: Output lockfile path
    required: false
    default: cataloglock.lock.json
  sarif:
    description: Output SARIF path
    required: false
    default: cataloglock.sarif
  html:
    description: Output HTML report path
    required: false
    default: cataloglock-report.html
outputs:
  highest-severity:
    description: Highest finding severity
  findings:
    description: Finding count
  catalogs:
    description: Resolved catalog count
  mcp-surfaces:
    description: Locked MCP server surface count
  mcp-tools:
    description: Locked MCP tool count
runs:
  using: node20
  main: dist/action.cjs
