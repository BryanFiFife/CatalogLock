name: CatalogLock
description: Security-gate ARD v0.91 discovery, trust evidence, and complete MCP protocol surfaces with deterministic lockfiles.
author: BryanFiFife
branding:
  icon: lock
  color: purple
inputs:
  target:
    description: Domain, ARD manifest URL, or HTML page advertising rel="ard"
    required: true
  policy:
    description: Optional CatalogLock policy JSON path
    required: false
  fail-on:
    description: info, warning, error or critical
    required: false
    default: error
  inspect-mcp-primitives:
    description: Inspect and lock tools, prompts, resources and resource templates
    required: false
    default: "true"
  inspect-mcp-discover:
    description: Inspect and lock server/discover capabilities, extensions and instructions
    required: false
    default: "true"
  inspect-mcp-tools:
    description: Deprecated compatibility alias for inspect-mcp-primitives
    required: false
  lockfile:
    description: Output lockfile path
    required: false
    default: cataloglock.lock.json
  sarif:
    description: Output SARIF path
    required: false
    default: cataloglock.sarif
  html:
    description: Output HTML report path
    required: false
    default: cataloglock-report.html
outputs:
  highest-severity:
    description: Highest finding severity
  findings:
    description: Finding count
  catalogs:
    description: Resolved ARD entry-source count
  mcp-surfaces:
    description: Locked MCP profile/endpoint surface count
  mcp-tools:
    description: Locked MCP tool count
  mcp-prompts:
    description: Locked MCP prompt count
  mcp-resources:
    description: Locked MCP resource count
  mcp-resource-templates:
    description: Locked MCP resource-template count
runs:
  using: node24
  main: dist/action.cjs
