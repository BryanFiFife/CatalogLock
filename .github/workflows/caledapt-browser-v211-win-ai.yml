name: Caledapt Browser v2.1.1 Windows local AI validation
on:
  push:
    paths:
      - ".github/workflows/caledapt-browser-v211-win-ai.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Download pinned llama.cpp runtime with Node fetch
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs');
          const url='https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-win-cpu-x64.zip';
          (async()=>{const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());fs.writeFileSync('llama.zip',b);console.log('downloaded',b.length)})().catch(e=>{console.error(e);process.exit(1)})
          '@ | Set-Content -Encoding UTF8 download.cjs
          node download.cjs
      - name: Verify, extract, and execute runtime
        shell: pwsh
        run: |
          $expected='fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3'
          $got=(Get-FileHash .\llama.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $expected) { throw "SHA mismatch: $got" }
          New-Item -ItemType Directory -Force runtime | Out-Null
          tar.exe -xf .\llama.zip -C .\runtime
          if (-not (Test-Path .\runtime\llama-server.exe)) { throw 'llama-server.exe missing' }
          $out=& .\runtime\llama-server.exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "llama-server failed: $out" }
          Write-Host $out
          Write-Host 'CALEDAPT_WINDOWS_LLAMA_RUNTIME=PASS'
