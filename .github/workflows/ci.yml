name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:check
      - run: npm audit --audit-level=high
      - name: Reproducible generated dist
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist /tmp/dist-before
          npm run build
          diff -ru /tmp/dist-before dist
