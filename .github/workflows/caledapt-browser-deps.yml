name: Caledapt Browser dependency bundle
on:
  push:
    branches:
      - caledapt-browser-v2-build-20260828
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps
          curl -fL --retry 4 --retry-delay 2 -o deps/electron-v44.0.0-linux-x64.zip https://github.com/electron/electron/releases/download/v44.0.0/electron-v44.0.0-linux-x64.zip
          curl -fL --retry 4 --retry-delay 2 -o deps/electron-v44.0.0-win32-x64.zip https://github.com/electron/electron/releases/download/v44.0.0/electron-v44.0.0-win32-x64.zip
          curl -fL --retry 4 --retry-delay 2 -o deps/llama-b10516-bin-ubuntu-x64.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-ubuntu-x64.tar.gz
          curl -fL --retry 4 --retry-delay 2 -o deps/llama-b10516-bin-win-cpu-x64.zip https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-win-cpu-x64.zip
          echo "d65286d812719f2b4c1a1b806a80f288a1058c89c7b058dae1e03ab25e499446  deps/electron-v44.0.0-linux-x64.zip" | sha256sum -c -
          echo "e61aa3bcea8152bc0730abd015e47c032d778a0ef10e2a1c78ba3c4ea47942f9  deps/electron-v44.0.0-win32-x64.zip" | sha256sum -c -
          echo "f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35  deps/llama-b10516-bin-ubuntu-x64.tar.gz" | sha256sum -c -
          echo "fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3  deps/llama-b10516-bin-win-cpu-x64.zip" | sha256sum -c -
          sha256sum deps/* > deps/SHA256SUMS.txt

      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: caledapt-browser-deps
          path: deps/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
