name: Recover v0.3 staged candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-v0.3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct recoverable staged payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery recovered/tree
          for f in .release/v0.3.0.part{00..10}.b64; do
            tr -d '[:space:]' < "$f"
          done > recovery/partial.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path("recovery/partial.b64")
          s=p.read_text()
          bad=[(i,c) for i,c in enumerate(s) if c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="]
          if bad:
              raise SystemExit(f"invalid base64 chars: {bad[:10]}")
          usable=(len(s)//4)*4
          Path("recovery/partial.trimmed.b64").write_text(s[:usable])
          Path("recovery/partial.tar.gz").write_bytes(base64.b64decode(s[:usable], validate=True))
          print("base64 chars", len(s), "decoded chars", usable, "bytes", Path("recovery/partial.tar.gz").stat().st_size)
          PY
          set +e
          gzip -dc recovery/partial.tar.gz > recovery/partial.tar
          gzip_rc=$?
          set -e
          echo "gzip exit: $gzip_rc (truncation is expected)"
          tar -xf recovery/partial.tar -C recovered/tree --ignore-zeros --ignore-failed-read || true
          find recovered/tree -type f -print | sort > recovered/files.txt
          sha256sum .release/v0.3.0.part{00..10}.b64 > recovered/staged-parts.sha256
          cp recovery/partial.tar recovered/partial.tar
          echo "Recovered files:"
          cat recovered/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cataloglock-v0.3-partial-recovery
          path: recovered
          if-no-files-found: error
          retention-days: 1
