name: Release v0.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.3.0.yml"
      - ".release/apply-v03-final.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cataloglock-v0.3.0-release
  cancel-in-progress: false

env:
  CANDIDATE_SHA256: a5b3de9b6ece09b34cc47173e1c5cb54cd701d830beab9355d937b60ec816412
  FINAL_SOURCE_SHA256: a063f54ece339763db67788a0612bdc9f04fa6f4e23771e6bdb6a6c9d63dd18b
  ARD_COMMIT: aa3e598bb7752a9175897823234311216acfa864
  MCP_SDK_COMMIT: 7b781ed4e25355a25d15974f3c76de81299694ed

jobs:
  matrix:
    name: Node ${{ matrix.node }} full gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and seal final source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cataloglock-candidate
          mkdir -p /tmp/cataloglock-candidate
          cat .release/v0.3-src{00..09}.b64 | tr -d '[:space:]' | base64 -d > /tmp/candidate.tar.gz
          echo "${CANDIDATE_SHA256}  /tmp/candidate.tar.gz" | sha256sum -c -
          tar -xzf /tmp/candidate.tar.gz -C /tmp/cataloglock-candidate
          python .release/apply-v03-final.py /tmp/cataloglock-candidate
          cd /tmp/cataloglock-candidate
          find . -type f ! -path './dist/*' ! -path './.git/*' ! -path './.release/*' ! -path './node_modules/*' ! -path './.test-dist/*' ! -path './release/*' ! -path './coverage/*' -printf '%P\n' | LC_ALL=C sort > /tmp/final-source-files.txt
          test "$(wc -l < /tmp/final-source-files.txt)" -eq 48
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -czf /tmp/final-source.tar.gz -T /tmp/final-source-files.txt
          echo "${FINAL_SOURCE_SHA256}  /tmp/final-source.tar.gz" | sha256sum -c -
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Clean install and complete release gate
        working-directory: /tmp/cataloglock-candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run release:check
          npm audit --audit-level=high
      - name: Prove generated dist reproducible
        working-directory: /tmp/cataloglock-candidate
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-first.sha256
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-second.sha256
          diff -u /tmp/dist-first.sha256 /tmp/dist-second.sha256

  ard:
    name: Official ARD v0.91 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and seal final source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cataloglock-candidate
          mkdir -p /tmp/cataloglock-candidate
          cat .release/v0.3-src{00..09}.b64 | tr -d '[:space:]' | base64 -d > /tmp/candidate.tar.gz
          echo "${CANDIDATE_SHA256}  /tmp/candidate.tar.gz" | sha256sum -c -
          tar -xzf /tmp/candidate.tar.gz -C /tmp/cataloglock-candidate
          python .release/apply-v03-final.py /tmp/cataloglock-candidate
          cd /tmp/cataloglock-candidate
          find . -type f ! -path './dist/*' ! -path './.git/*' ! -path './.release/*' ! -path './node_modules/*' ! -path './.test-dist/*' ! -path './release/*' ! -path './coverage/*' -printf '%P\n' | LC_ALL=C sort > /tmp/final-source-files.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -czf /tmp/final-source.tar.gz -T /tmp/final-source-files.txt
          echo "${FINAL_SOURCE_SHA256}  /tmp/final-source.tar.gz" | sha256sum -c -
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pin official ARD conformance suite
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ards-project/ard-spec.git /tmp/ard
          git -C /tmp/ard checkout "${ARD_COMMIT}"
          test "$(git -C /tmp/ard rev-parse HEAD)" = "${ARD_COMMIT}"
          python -m pip install --disable-pip-version-check jsonschema
      - name: Official ARD manifest conformance
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/ard/conformance/bin/conformance-test manifest /tmp/cataloglock-candidate/examples/good-ard.json
          python /tmp/ard/conformance/bin/conformance-test manifest /tmp/cataloglock-candidate/examples/nested-ard.json

  mcp:
    name: Official MCP 2026 interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and seal final source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cataloglock-candidate
          mkdir -p /tmp/cataloglock-candidate
          cat .release/v0.3-src{00..09}.b64 | tr -d '[:space:]' | base64 -d > /tmp/candidate.tar.gz
          echo "${CANDIDATE_SHA256}  /tmp/candidate.tar.gz" | sha256sum -c -
          tar -xzf /tmp/candidate.tar.gz -C /tmp/cataloglock-candidate
          python .release/apply-v03-final.py /tmp/cataloglock-candidate
          cd /tmp/cataloglock-candidate
          find . -type f ! -path './dist/*' ! -path './.git/*' ! -path './.release/*' ! -path './node_modules/*' ! -path './.test-dist/*' ! -path './release/*' ! -path './coverage/*' -printf '%P\n' | LC_ALL=C sort > /tmp/final-source-files.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -czf /tmp/final-source.tar.gz -T /tmp/final-source-files.txt
          echo "${FINAL_SOURCE_SHA256}  /tmp/final-source.tar.gz" | sha256sum -c -
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build CatalogLock
        working-directory: /tmp/cataloglock-candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Verify npm-published SDK 2.0.0 compatibility boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mcp-stable
          mkdir -p /tmp/mcp-stable
          cd /tmp/mcp-stable
          npm init -y >/dev/null
          npm install --ignore-scripts @modelcontextprotocol/server@2.0.0 zod@4
          node -e "const p=require('./node_modules/@modelcontextprotocol/server/package.json'); if(p.version!=='2.0.0') process.exit(1)"
          cat > boundary.mjs <<'EOF'
          import { McpServer, WebStandardStreamableHTTPServerTransport } from '@modelcontextprotocol/server';
          import * as z from 'zod/v4';
          import { inspectMcpSurfaces, mergePolicy } from '/tmp/cataloglock-candidate/dist/index.js';

          const server = new McpServer({ name: 'cataloglock-stable-boundary', version: '1.0.0' });
          server.registerTool('echo', { inputSchema: z.object({ text: z.string() }) }, async ({ text }) => ({ content: [{ type: 'text', text }] }));
          const transport = new WebStandardStreamableHTTPServerTransport({ sessionIdGenerator: undefined });
          await server.connect(transport);

          const endpoint='https://interop.invalid/mcp';
          const result={root:'https://interop.invalid/.well-known/ard.json',rootSourceKind:'explicit',ardContextSha256:'interop',catalogs:[{url:'https://interop.invalid/.well-known/ard.json',sourceHost:'interop.invalid',sha256:'interop',depth:0,catalog:{entries:[{identifier:'urn:air:interop.invalid:server:test',displayName:'Stable SDK boundary',type:'application/mcp-server-card+json',data:{remotes:[{id:'primary',type:'streamable-http',url:endpoint}]}}]}}],findings:[],trust:[]};
          const requester=async(url,body,policy,headers)=>{
            const response=await transport.handleRequest(new Request(url,{method:'POST',headers:{...headers,'Content-Type':'application/json','Accept':'application/json, text/event-stream'},body:JSON.stringify(body)}));
            return {url,status:response.status,body:await response.text(),contentType:response.headers.get('content-type')??undefined,headers:Object.fromEntries(response.headers.entries())};
          };
          const out=await inspectMcpSurfaces(result,mergePolicy({requireMcpInspection:true,inspectMcpPrimitives:false}),{requester});
          const messages=out.findings.map(f=>f.message);
          if(!messages.some(m=>m.includes('Unsupported protocol version: 2026-07-28'))) throw new Error(JSON.stringify(out.findings,null,2));
          if(messages.some(m=>m.includes('matching request id'))) throw new Error('protocol rejection regressed to response-id mismatch');
          console.log('published SDK 2.0.0 boundary PASS');
          await server.close();
          EOF
          node boundary.mjs
      - name: Build pinned current official MCP SDK source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mcp-sdk
          git clone --filter=blob:none https://github.com/modelcontextprotocol/typescript-sdk.git /tmp/mcp-sdk
          git -C /tmp/mcp-sdk checkout "${MCP_SDK_COMMIT}"
          test "$(git -C /tmp/mcp-sdk rev-parse HEAD)" = "${MCP_SDK_COMMIT}"
          cd /tmp/mcp-sdk
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @modelcontextprotocol/server... build
      - name: Exercise CatalogLock against pinned official MCP 2026 server
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mcp-sdk/packages/server/cataloglock-interop.mjs <<'EOF'
          import { McpServer, createMcpHandler } from './dist/index.mjs';
          import * as z from 'zod/v4';
          import { inspectMcpSurfaces, mergePolicy } from '/tmp/cataloglock-candidate/dist/index.js';

          const handler=createMcpHandler(async()=>{
            const server=new McpServer({name:'cataloglock-interop',version:'1.0.0'});
            server.registerTool('echo',{title:'Echo',description:'Echo text without side effects',inputSchema:z.object({text:z.string()})},async({text})=>({content:[{type:'text',text}]}));
            return server;
          },{legacy:'reject',responseMode:'json'});

          const identifier='urn:air:interop.invalid:server:test';
          const endpoint='https://interop.invalid/mcp';
          const result={root:'https://interop.invalid/.well-known/ard.json',rootSourceKind:'explicit',ardContextSha256:'interop',catalogs:[{url:'https://interop.invalid/.well-known/ard.json',sourceHost:'interop.invalid',sha256:'interop',depth:0,catalog:{entries:[{identifier,displayName:'Pinned official SDK interoperability server',type:'application/mcp-server-card+json',data:{remotes:[{id:'primary',type:'streamable-http',url:endpoint}]}}]}}],findings:[],trust:[]};
          const requester=async(url,body,policy,headers)=>{
            const response=await handler.fetch(new Request(url,{method:'POST',headers:{...headers,'Content-Type':'application/json','Accept':'application/json, text/event-stream'},body:JSON.stringify(body)}));
            return {url,status:response.status,body:await response.text(),contentType:response.headers.get('content-type')??undefined,headers:Object.fromEntries(response.headers.entries())};
          };
          const out=await inspectMcpSurfaces(result,mergePolicy({requireMcpInspection:true,inspectMcpDiscover:true,inspectMcpPrimitives:true}),{requester});
          const bad=out.findings.filter(f=>f.severity==='error'||f.severity==='critical');
          if(bad.length) throw new Error(JSON.stringify(bad,null,2));
          if(out.surfaces.length!==1) throw new Error('expected exactly one MCP surface');
          const surface=out.surfaces[0];
          if(!surface.discover) throw new Error('server/discover was not locked');
          if(!surface.tools?.items?.some(x=>x.key==='echo')) throw new Error('official SDK echo tool was not locked');
          if(!surface.discover.supportedVersions.includes('2026-07-28')) throw new Error('official SDK did not advertise MCP 2026-07-28');
          console.log('pinned official MCP 2026 interoperability PASS',{surfaceId:surface.surfaceId,protocolVersion:surface.protocolVersion,tools:surface.tools.items.map(x=>x.key)});
          await handler.close?.();
          EOF
          cd /tmp/mcp-sdk/packages/server
          node cataloglock-interop.mjs

  promote:
    name: Promote clean tree and publish v0.3.0
    needs: [matrix, ard, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reconstruct and final-gate exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cataloglock-candidate
          mkdir -p /tmp/cataloglock-candidate
          cat .release/v0.3-src{00..09}.b64 | tr -d '[:space:]' | base64 -d > /tmp/candidate.tar.gz
          echo "${CANDIDATE_SHA256}  /tmp/candidate.tar.gz" | sha256sum -c -
          tar -xzf /tmp/candidate.tar.gz -C /tmp/cataloglock-candidate
          python .release/apply-v03-final.py /tmp/cataloglock-candidate
          cd /tmp/cataloglock-candidate
          find . -type f ! -path './dist/*' ! -path './.git/*' ! -path './.release/*' ! -path './node_modules/*' ! -path './.test-dist/*' ! -path './release/*' ! -path './coverage/*' -printf '%P\n' | LC_ALL=C sort > /tmp/final-source-files.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -czf /tmp/final-source.tar.gz -T /tmp/final-source-files.txt
          echo "${FINAL_SOURCE_SHA256}  /tmp/final-source.tar.gz" | sha256sum -c -
          npm ci --ignore-scripts
          npm run release:check
          npm audit --audit-level=high
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-first.sha256
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist-second.sha256
          diff -u /tmp/dist-first.sha256 /tmp/dist-second.sha256
          rm -rf node_modules .test-dist .smoke coverage release .release
          node scripts/check-tree.mjs
      - name: Replace main with clean release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .
          cp -a /tmp/cataloglock-candidate/. .
          test ! -e .release
          test ! -e node_modules
          test ! -e .test-dist
          node scripts/check-tree.mjs
          git add -A
          if git ls-files | grep -E '(^|/)(node_modules|\.test-dist|\.release|\.smoke|coverage|release)(/|$)|(^|/)\.env($|\.)|\.log$'; then
            echo "forbidden release artifact is tracked" >&2
            exit 1
          fi
          git commit -m "release: CatalogLock v0.3.0"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build release artifacts from exact commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          git archive --format=zip --prefix=CatalogLock-v0.3.0/ HEAD > /tmp/release-assets/CatalogLock-v0.3.0.zip
          npm pack --ignore-scripts --pack-destination /tmp/release-assets >/tmp/npm-pack-name.txt
          test -f /tmp/release-assets/cataloglock-0.3.0.tgz
          (cd /tmp/release-assets && sha256sum CatalogLock-v0.3.0.zip cataloglock-0.3.0.tgz > CatalogLock-v0.3.0.sha256)
          unzip -l /tmp/release-assets/CatalogLock-v0.3.0.zip | grep -E '(node_modules|\.test-dist|\.release|\.smoke|coverage/|release/)' && exit 1 || true
          tar -tzf /tmp/release-assets/cataloglock-0.3.0.tgz | grep -E '(node_modules|\.test-dist|\.release|\.smoke|coverage/|tests/|src/)' && exit 1 || true
          cat /tmp/release-assets/CatalogLock-v0.3.0.sha256
      - name: Push clean main and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin refs/tags/v0.3.0 | grep -q .; then
            echo "v0.3.0 tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          git push origin HEAD:main
          git tag -a v0.3.0 -m "CatalogLock v0.3.0"
          git push origin refs/tags/v0.3.0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3.0             /tmp/release-assets/CatalogLock-v0.3.0.zip             /tmp/release-assets/cataloglock-0.3.0.tgz             /tmp/release-assets/CatalogLock-v0.3.0.sha256             --title "CatalogLock v0.3.0 — Complete Protocol-Surface & Trust-Context Locking"             --notes-file docs/releases/v0.3.0.md             --verify-tag
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test "$(git rev-list -n 1 v0.3.0)" = "${RELEASE_SHA}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA}"
          gh release view v0.3.0 --json tagName,isDraft,isPrerelease,targetCommitish,assets,url > /tmp/release.json
          cat /tmp/release.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/release.json','utf8'));
          if(r.tagName!=='v0.3.0'||r.isDraft||r.isPrerelease) process.exit(1);
          const names=new Set(r.assets.map(a=>a.name));
          for(const n of ['CatalogLock-v0.3.0.zip','cataloglock-0.3.0.tgz','CatalogLock-v0.3.0.sha256']) if(!names.has(n)) throw new Error('missing '+n);
          NODE
